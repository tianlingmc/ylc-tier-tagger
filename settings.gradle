pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // 自动下载缺失的 JDK。1.20.1~1.20.4 的包要用 Java 17 编译，
    // CI 上不一定预装，靠这个拉。
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ylc-tier-tagger'
