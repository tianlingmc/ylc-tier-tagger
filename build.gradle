plugins {
    // 必须是 fabric-loom-remap：net.fabricmc.fabric-loom 是「不 remap」标记插件，
    // 它会强制 disableObfuscation=true，从而不创建 mappings configuration
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

/**
 * 每次构建把第三位版本号 +1（0.1.0 -> 0.1.1 -> 0.1.2 ...）。
 * 发布前保持 0.x.y，不进 1.0.0。
 * 用 -PnoVersionBump 可以关掉（例如只想重新打一次包时）。
 */
def bumpVersion() {
    if (project.hasProperty('noVersionBump')) {
        return project.mod_version
    }
    def f = project.file('gradle.properties')
    def text = f.getText('UTF-8')
    def matcher = text =~ /(?m)^mod_version=(.*)$/
    if (!matcher.find()) {
        return project.mod_version
    }
    def parts = matcher.group(1).trim().tokenize('.')
    def next = "${parts[0]}.${parts[1]}.${(parts[2] as int) + 1}"
    f.write(text.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${next}"), 'UTF-8')
    return next
}

version = bumpVersion()
group = project.maven_group

base {
    archivesName = "YLCTierTagger"
}

repositories {
    // cloth-config 官方仓库（可选集成用）
    maven { url "https://maven.shedaniel.me/" }
    // Modrinth 的 Maven 代理，用来拉 ModMenu
    maven { url "https://api.modrinth.com/maven" }
}

// Minecraft 1.20.5 及以后运行在 Java 21 上，1.20.1~1.20.4 是 Java 17。
// 想给老版本出包时用 -PjavaRelease=17 -PmcVersion=1.20.4 -PyarnVersion=...
def targetJavaVersion = (project.findProperty('javaRelease') ?: '21') as int

// 可以用 -PmcVersion=1.20.4 -PyarnVersion=1.20.4+build.3 -PjavaRelease=17 切到旧版本出包
def mcVersion = project.findProperty('mcVersion') ?: project.minecraft_version
def yarnVersion = project.findProperty('yarnVersion') ?: project.yarn_mappings
def fabricApiVersion = project.findProperty('fabricApiVersion') ?: project.fabric_version
def modmenuVer = project.findProperty('modmenuVersion') ?: project.modmenu_version

// manifest 里声明的兼容范围，随构建目标自动切换
def compatRange = project.findProperty('compatRange')
        ?: (mcVersion.startsWith('1.20') ? '>=1.20.1 <1.20.5' : '>=1.20.5 <1.22')
def javaRange = project.findProperty('javaRange') ?: (targetJavaVersion >= 21 ? '>=21' : '>=17')

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnVersion}:v2"
    // 只依赖 loader 本身，不需要任何前置模组
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // 以下两个都是可选集成：仅编译期与 remap 需要，
    // 玩家装了才有模组列表里的配置按钮 / config 命令，没装也能正常使用
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    modImplementation "maven.modrinth:modmenu:${modmenuVer}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_range", compatRange
    inputs.property "java_range", javaRange
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "minecraft_range": compatRange,
                "java_range": javaRange,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// 产物名：YLCTierTagger-<版本号>-fabric-mc<目标MC版本>.jar
tasks.named("remapJar") {
    archiveFileName = "YLCTierTagger-${project.version}-fabric-mc${mcVersion}.jar"
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
