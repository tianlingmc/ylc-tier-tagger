name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本号 ${VERSION}"

      - name: 构建 1.20.5 ~ 1.21.11（Java 21）
        run: |
          ./gradlew build --no-daemon
          mkdir -p dist
          cp "build/libs/TLCTierTagger-${{ steps.ver.outputs.version }}-fabric.jar" \
             "dist/TLCTierTagger-${{ steps.ver.outputs.version }}-fabric.jar"

      - name: 构建 1.20.1 ~ 1.20.4（Java 17）
        run: |
          ./gradlew build --no-daemon \
            -PnoVersionBump \
            -PmcVersion=1.20.4 \
            -PyarnVersion=1.20.4+build.3 \
            -PjavaRelease=17 \
            -PfabricApiVersion=0.97.3+1.20.4 \
            -PmodmenuVersion=9.2.0
          cp "build/libs/TLCTierTagger-${{ steps.ver.outputs.version }}-fabric.jar" \
             "dist/TLCTierTagger-${{ steps.ver.outputs.version }}-fabric-mc1.20.4.jar"

      - name: 校验产物
        run: |
          ls -l dist/
          for f in dist/*.jar; do
            echo "--- $f"
            unzip -p "$f" fabric.mod.json | head -20
          done

      - name: 生成更新日志
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            {
              echo 'changelog<<EOF'
              git log --pretty='- %s (%h)' "$PREV"..HEAD
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'changelog=首次发布' >> "$GITHUB_OUTPUT"
          fi

      - name: 上传到 Modrinth
        uses: modrinth/modrinth-action@v1
        with:
          api_key: ${{ secrets.MODRINTH_TOKEN }}
          project_id: dDefGuBN
          file_path: dist/*.jar
          version_number: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          changelog: ${{ steps.changelog.outputs.changelog }}
          game_versions: >-
            1.20.1,1.20.2,1.20.3,1.20.4,1.20.5,1.20.6,1.21.1,1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11
          dependencies: >-
            [{"project_id":"mOgUt4GM","dependency_type":"optional"},{"project_id":"9s6osm5g","dependency_type":"optional"}]
          upload: true

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
